services:
  motoserver:
    image: motoserver/moto:latest
    container_name: motoserver
    ports:
      - "5000:5000"
    environment:
      - MOTO_PORT=5000
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5000), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - demo-net

networks:
  demo-net:
    driver: bridge
